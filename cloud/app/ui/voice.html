<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LONGTHINK // VOICE CORE</title>
<style>
  :root {
    color-scheme: dark;
    --cy: #22d3ee; --mg: #f0f; --mg: #e879f9; --bg: #04060f;
    --panel: rgba(10, 18, 38, .78); --line: rgba(34, 211, 238, .25);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #d9f4ff; overflow-x: hidden;
    font-family: "Consolas", "JetBrains Mono", ui-monospace, monospace; }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .grid-floor { position: fixed; left: -25%; right: -25%; bottom: -10%; height: 45%;
    background: linear-gradient(transparent, rgba(34,211,238,.07)),
      repeating-linear-gradient(90deg, rgba(34,211,238,.14) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(0deg, rgba(34,211,238,.14) 0 1px, transparent 1px 60px);
    transform: perspective(500px) rotateX(62deg); z-index: 0; animation: floor 8s linear infinite; }
  @keyframes floor { to { background-position: 0 0, 0 0, 0 60px; } }
  .wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line);
    background: var(--panel); padding: 12px 16px; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  .logo { width: 42px; height: 42px; border: 2px solid var(--cy); border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; box-shadow: 0 0 18px var(--cy), inset 0 0 12px rgba(34,211,238,.5); animation: spin 12s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; margin: 0; letter-spacing: .18em; text-shadow: 0 0 12px var(--cy); }
  .sys { margin-left: auto; font-size: 11px; color: #7dd3fc; text-align: right; line-height: 1.7; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; margin-right: 6px; }
  /* CORE */
  .core-zone { position: relative; width: 320px; height: 320px; margin: 26px auto 6px; }
  #viz { position: absolute; inset: 0; }
  .ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(34,211,238,.4); }
  .r1 { inset: 8px; animation: spin 24s linear infinite; }
  .r2 { inset: 26px; animation: spin 18s linear infinite reverse; border-color: rgba(232,121,249,.35); }
  #core { position: absolute; inset: 86px; border-radius: 50%; cursor: pointer; border: 2px solid var(--cy);
    background: radial-gradient(circle at 50% 35%, #164e63, #04121f 70%);
    color: #fff; font-size: 52px; box-shadow: 0 0 34px rgba(34,211,238,.55), inset 0 0 30px rgba(34,211,238,.35);
    transition: transform .15s; }
  #core:hover { transform: scale(1.04); }
  #core.live { border-color: #fb7185; box-shadow: 0 0 44px rgba(251,113,133,.8), inset 0 0 34px rgba(251,113,133,.5); animation: beat 1s infinite; }
  @keyframes beat { 50% { transform: scale(1.06); } }
  #status { text-align: center; min-height: 24px; font-size: 13px; letter-spacing: .12em; color: #7dd3fc; text-shadow: 0 0 8px rgba(34,211,238,.7); }
  /* HUD panels */
  .hud { position: relative; border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; margin-top: 14px; }
  .hud::before, .hud::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cy); }
  .hud::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .hud::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .tag { font-size: 11px; letter-spacing: .2em; color: var(--mg); text-shadow: 0 0 8px rgba(232,121,249,.7); }
  .txt { white-space: pre-wrap; margin-top: 8px; font-size: 14px; line-height: 1.65; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  input, select { flex: 1; min-width: 150px; background: #060c1c; color: #d9f4ff; border: 1px solid var(--line); padding: 9px 11px; font-family: inherit; font-size: 13px; }
  button.btn { background: transparent; color: var(--cy); border: 1px solid var(--cy); padding: 9px 16px; cursor: pointer; font-family: inherit; letter-spacing: .1em; }
  button.btn:hover { background: rgba(34,211,238,.15); box-shadow: 0 0 12px rgba(34,211,238,.5); }
  audio { width: 100%; margin-top: 10px; filter: hue-rotate(160deg); }
  footer { text-align: center; margin-top: 22px; font-size: 11px; color: #48607e; letter-spacing: .15em; }
  footer a { color: #7dd3fc; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="grid-floor"></div>
<div class="wrap">
  <header>
    <div class="logo">◈</div>
    <h1>LONGTHINK // VOICE CORE</h1>
    <div class="sys"><span class="dot"></span><span id="sys-vec">… vectors</span><br><span id="sys-net">PGVECTOR · 768D · ONLINE</span></div>
  </header>

  <div class="core-zone">
    <canvas id="viz" width="320" height="320"></canvas>
    <div class="ring r1"></div><div class="ring r2"></div>
    <button id="core" title="Nhấn để nói / dừng">◉</button>
  </div>
  <div id="status">» HỆ THỐNG SẴN SÀNG — NHẤN LÕI ĐỂ RA LỆNH «</div>

  <div class="row">
    <input id="key" type="password" placeholder="X-API-Key (lưu local)">
    <select id="voice"><option value="">GIỌNG: MẶC ĐỊNH</option></select>
    <button class="btn" id="save">⌁ LƯU KEY</button>
  </div>

  <div class="hud"><div class="tag">◢ INCOMING TRANSMISSION — BẠN</div><div class="txt" id="q">— chờ tín hiệu —</div></div>
  <div class="hud"><div class="tag">◢ SYNTHESIZED RESPONSE — LONGTHINK</div><div class="txt" id="a">— lõi AI đang chờ lệnh —</div><audio id="player" controls></audio></div>

  <footer><a href="/ui/">← HUMAN KNOWLEDGE INTERFACE</a> · LONGTHINK LEARNING ENGINE · VOICE MODULE v1.0</footer>
</div>
<script>
const $ = (s) => document.querySelector(s);
const core = $("#core"), statusEl = $("#status");
$("#key").value = localStorage.getItem("fsb.apiKey") || "";
$("#save").onclick = () => { localStorage.setItem("fsb.apiKey", $("#key").value.trim()); say("» KEY ĐÃ KHÓA VÀO BỘ NHỚ LOCAL «"); };
function say(m) { statusEl.textContent = m; }

/* --- starfield --- */
const sc = $("#stars"), sx = sc.getContext("2d"); let stars = [];
function sky() { sc.width = innerWidth; sc.height = innerHeight;
  stars = Array.from({length: 130}, () => ({x: Math.random()*sc.width, y: Math.random()*sc.height, s: Math.random()*1.6+.3, v: Math.random()*.4+.1})); }
addEventListener("resize", sky); sky();
(function loop() { sx.clearRect(0,0,sc.width,sc.height); sx.fillStyle = "#22d3ee";
  for (const st of stars) { sx.globalAlpha = .25 + Math.random()*.5; sx.fillRect(st.x, st.y, st.s, st.s);
    st.y += st.v; if (st.y > sc.height) st.y = 0; } requestAnimationFrame(loop); })();

/* --- core visualizer ring --- */
const vc = $("#viz"), vx = vc.getContext("2d");
let level = 0, analyser = null, micData = null;
function drawViz(t) {
  vx.clearRect(0,0,320,320);
  if (analyser) { analyser.getByteFrequencyData(micData);
    level = micData.slice(0, 24).reduce((a,b)=>a+b,0) / 24 / 255; }
  else { level += (((t/900) % 2 < 1 ? .12 : .2) - level) * .05; }
  const cx = 160, cy = 160;
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2 + t / 2400;
    const base = 118 + Math.sin(t/700 + i*.4) * 5 + level * 46 * Math.abs(Math.sin(i*1.7 + t/300));
    const x1 = cx + Math.cos(a) * 104, y1 = cy + Math.sin(a) * 104;
    const x2 = cx + Math.cos(a) * base, y2 = cy + Math.sin(a) * base;
    vx.strokeStyle = core.classList.contains("live") ? "#fb7185" : (i % 3 ? "#22d3ee" : "#e879f9");
    vx.lineWidth = 2.4; vx.shadowBlur = 10; vx.shadowColor = vx.strokeStyle;
    vx.beginPath(); vx.moveTo(x1,y1); vx.lineTo(x2,y2); vx.stroke();
  }
  vx.shadowBlur = 0;
  requestAnimationFrame(drawViz);
}
requestAnimationFrame(drawViz);

/* --- sys stats --- */
(async () => {
  const key = localStorage.getItem("fsb.apiKey") || "";
  if (!key) return;
  try {
    const r = await fetch("/health/details", { headers: { "X-API-Key": key } });
    if (!r.ok) return;
    const j = await r.json();
    $("#sys-vec").textContent = Number(j.storage.counts.memories).toLocaleString("vi-VN") + " vectors";
    $("#sys-net").textContent = "PGVECTOR · " + j.embeddings.dimension + "D · ONLINE";
    const v = await fetch("/v1/voice/voices", { headers: { "X-API-Key": key } }).then(x => x.json());
    const sel = $("#voice");
    Object.entries(v.voices || {}).forEach(([id, name]) => {
      const o = document.createElement("option"); o.value = id; o.textContent = "GIỌNG: " + name.toUpperCase(); sel.appendChild(o);
    });
  } catch (e) { /* offline */ }
})();

/* --- push to talk --- */
let recorder = null, chunks = [];
core.onclick = async () => {
  const key = (localStorage.getItem("fsb.apiKey") || "").trim();
  if (!key) { say("» CẢNH BÁO: NHẬP X-API-KEY TRƯỚC «"); return; }
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser(); analyser.fftSize = 128;
    micData = new Uint8Array(analyser.frequencyBinCount); src.connect(analyser);
    chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "" });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop()); actx.close().catch(()=>{});
      analyser = null; core.classList.remove("live");
      const r = recorder; recorder = null;
      await sendVoice(new Blob(chunks, { type: r.mimeType || "audio/webm" }), key);
    };
    recorder.start(); core.classList.add("live");
    say("» ĐANG LẮNG NGHE… NHẤN LÕI LẦN NỮA ĐỂ TRUYỀN «");
  } catch (e) { say("» LỖI MIC: " + e.message + " «"); }
};
async function sendVoice(blob, key) {
  if (!blob.size) { say("» KHÔNG THU ĐƯỢC TÍN HIỆU «"); return; }
  say("» ĐANG TRUY VẤN LONGTHINK… «");
  $("#q").textContent = "…đang giải mã…"; $("#a").textContent = "…lõi đang tổng hợp…";
  const fd = new FormData();
  fd.append("audio", blob, "mic.webm");
  const v = $("#voice").value; if (v) fd.append("voice", v);
  try {
    const r = await fetch("/v1/voice/ask", { method: "POST", headers: { "X-API-Key": key }, body: fd });
    const j = await r.json();
    if (!r.ok) { say("» LỖI: " + ((j.error && j.error.message) || r.status) + " «"); return; }
    $("#q").textContent = "❝ " + j.question + " ❞";
    $("#a").textContent = j.answer + "\n\n— " + j.memories_used + " vectors đã dùng · giọng " + j.voice + " —";
    const player = $("#player");
    player.src = "data:audio/mpeg;base64," + j.audio_base64;
    player.play().catch(() => {});
    say("» HOÀN TẤT — ĐANG PHÁT PHẢN HỒI «");
  } catch (e) { say("» LỖI MẠNG: " + e.message + " «"); }
}
</script>
</body>
</html>
